[tools]
claude = "latest"
codex = "latest"
node = "latest"
python = "latest"
uv = "latest"
# pnpm 11.9+ は macOS 単体バイナリを配布しないため aqua backend では入らない。npm backend を使う
"npm:pnpm" = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
herdr = "latest"
direnv = "latest"
java = "temurin-25"

[settings]
# mise-versions.jdx.dev の一覧が更新停止することがあり、latest が古いまま止まる。GitHub Releases を直接参照する
use_versions_host = false
